<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header"><div class="header-inner">
  <a class="site-name" href="{{ '/' | relative_url }}">BI Xia <span lang="zh-Hant">畢夏</span></a>
  <nav aria-label="Main navigation">{% for link in site.links %}
    <a href="{{ link.url | relative_url }}"{% if page.nav == link.title %} aria-current="page"{% endif %}>{{ link.title }}</a>
  {% endfor %}</nav>
</div></header>
<div class="site-body">
  <aside class="author-sidebar" aria-label="Profile and contact">{% include author-bio.html %}</aside>
  <main id="content" class="page-content">{{ content }}</main>
</div>
<footer class="site-footer">© {{ site.time | date: '%Y' }} BI Xia 畢夏</footer>
</body>
</html>
